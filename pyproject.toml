[project]
name = "prip"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "androguard>=4.0",
    "frida==17.16.4",
    "lief>=1.0.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[project.scripts]
prip = "prip.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist.force-include]
"frida-js-script/build" = "frida-js-script/build"

[tool.hatch.build.targets.wheel.force-include]
"frida-js-script/build" = "prip/js"
